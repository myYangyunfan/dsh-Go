name: Build APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'arm64 or x64'
        default: arm64
        type: choice
        options: [arm64, x64]
      mode:
        description: 'release or debug'
        default: release
        type: choice
        options: [release, debug]
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai
  # The Aliyun/Tencent Gradle mirrors are slow and unreliable from a US runner,
  # so the Android build resolves from the default repositories here.
  DSH_MAVEN_MIRRORS: '0'

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # gradlew is not tracked. Gradle configures the project before running a task,
      # so `wrapper` needs the pub cache and local.properties to exist first.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install host tools the runtime build needs
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            xz-utils zstd file unzip gnupg curl ca-certificates

      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-cache-${{ runner.os }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**/package*.json', 'runtime/patches/**') }}

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Point Gradle at the SDKs
        working-directory: app
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Ensure the Gradle wrapper exists
        working-directory: app/android
        run: |
          if [ ! -x gradlew ]; then
            gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          fi
          ./gradlew --version | head -n 5

      - name: Build the Linux runtime
        env:
          FLAVOR: ${{ inputs.flavor || 'arm64' }}
        run: |
          abi=$([ "$FLAVOR" = "x64" ] && echo x86_64 || echo arm64-v8a)
          bash runtime/build-runtime.sh "$abi"

      - name: Build the APK
        env:
          FLAVOR: ${{ inputs.flavor || 'arm64' }}
          MODE: ${{ inputs.mode || 'release' }}
          DSH_BETA_TOKEN_FILE: ''
        run: |
          bash tooling/build-apk.sh -f "$FLAVOR" --"$MODE" --keep-daemon

      - name: Collect artifacts
        id: collect
        run: |
          flavor=${{ inputs.flavor || 'arm64' }}
          mode=${{ inputs.mode || 'release' }}
          apk="app/build/app/outputs/flutter-apk/app-${flavor}-${mode}.apk"
          test -f "$apk"
          version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          name="dsh-go-${version}-${flavor}.apk"
          cp "$apk" "$name"
          sha256sum "$name" > SHA256SUMS.txt
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: |
            ${{ steps.collect.outputs.name }}
            SHA256SUMS.txt
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.collect.outputs.name }}" SHA256SUMS.txt \
            --title "dsh-go ${{ steps.collect.outputs.version }} (fork)" \
            --notes "Self-built fork APK. No key.properties is configured, so this build is debug-signed and differs from the official package: uninstall the official app before installing." \
            --verify-tag
